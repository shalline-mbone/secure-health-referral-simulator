{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4 text-primary">Edit Referral</h2>

  <form method="POST">
    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <input type="text" id="status" name="status" value="{{ referral.status }}" class="form-control">
    </div>

    <div class="mb-3">
      <label for="month" class="form-label">Month</label>
      <input type="text" id="month" name="month" value="{{ referral.month }}" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
